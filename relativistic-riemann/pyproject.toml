[project]
name = "relativistic-riemann"
version = "0.1.0"
description = "Relativistic Riemann problem solver for special relativistic hydrodynamics"
readme = "README.md"
authors = [
    { name = "Guo", email = "guo.yansong@optimind.tech" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]
keywords = ["relativistic", "hydrodynamics", "riemann", "solver", "sph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
relativistic-riemann = "relativistic_riemann.cli:main"
animate-riemann = "relativistic_riemann.animate:main"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
